<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #dff1fc;
  overflow: hidden;
}

.cover {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 500px;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at center,
      #eaf7ff 0%,
      #dff1fc 65%,
      #d6eafa 100%);
}

/* Các nét chấm li ti trang trí nền */
.cover::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .15;
  background-image: radial-gradient(#7399bd 0.8px, transparent 0.8px);
  background-size: 14px 14px;
}

/* CHỮ CORTIS Ở GIỮA */
.center {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 46%;
  max-width: 620px;
  min-width: 280px;
  transform: translate(-50%, -50%);
  z-index: 5;
  opacity: 0;
  animation: titleAppear 1.1s ease-out .15s forwards;
  cursor: pointer;
}

.center img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  transform-origin: center;
  animation: titleIdle 4s ease-in-out 1.5s infinite;
}

/* Cấu trúc Sticker chung */
.sticker {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--w);
  z-index: 2;
  opacity: 0;
  transform: translate(-50%, -50%) scale(.05) rotate(var(--rot, 0deg));
  transform-origin: center;
  animation: burst .85s cubic-bezier(.16,.8,.25,1.15) var(--delay) forwards;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.sticker img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  pointer-events: none;
  filter: drop-shadow(0 3px 6px rgba(49,81,107,0.18));
}

/* Hiệu ứng nổ sticker từ tâm */
@keyframes burst {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.05) rotate(0deg);
  }
  70% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.08) rotate(var(--rot, 0deg));
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(var(--rot, 0deg));
  }
}

@keyframes titleAppear {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.15);
  }
  75% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.06);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

@keyframes titleIdle {
  0%, 88%, 100% { transform: scale(1) rotate(0); }
  92% { transform: scale(1.035) rotate(-.5deg); }
  95% { transform: scale(1.035) rotate(.5deg); }
  98% { transform: scale(1.02) rotate(-.2deg); }
}

/* Hover & Click hiệu ứng nhún nhảy */
.sticker:hover,
.sticker:focus-visible {
  z-index: 10;
  animation: none;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.sticker img {
  transition: transform .28s ease, filter .28s ease;
}

.sticker:hover img,
.sticker:focus-visible img,
.sticker.tapped img {
  animation: wiggle .48s ease-in-out;
  transform: scale(1.14);
  filter: drop-shadow(0 8px 12px rgba(49,81,107,0.28));
}

@keyframes wiggle {
  0%, 100% { rotate: 0deg; }
  25% { rotate: -3deg; }
  50% { rotate: 3deg; }
  75% { rotate: -1.5deg; }
}

@media (max-width: 600px) {
  .center {
    width: 65%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .sticker, .center, .center img {
    animation-duration: .01ms !important;
    animation-delay: 0s !important;
  }
}
</style>
</head>

<body>

  <!-- CHỮ CORTIS Ở GIỮA -->

  <div class="sticker" style="--x:89.5%;--y:85%;--w:8%;--rot:12deg;--delay:1.64s">

  </div>

</div>

<script>
const cover = document.getElementById("cover");
const stickers = document.querySelectorAll(".sticker");

stickers.forEach(sticker => {
  sticker.addEventListener("click", () => {
    sticker.classList.remove("tapped");
    void sticker.offsetWidth;
    sticker.classList.add("tapped");

    setTimeout(() => {
      sticker.classList.remove("tapped");
    }, 550);
  });
});
</script>
</body>
</html>
